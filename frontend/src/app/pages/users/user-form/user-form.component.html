<div class="form-page">
  <div class="form-page-header">
    <button mat-icon-button routerLink="/dashboard/users" matTooltip="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>{{ isEdit ? 'Edit Admin User' : 'Add Admin User' }}</h2>
  </div>

  <div class="card form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput formControlName="username" id="field-username"/>
          <mat-error *ngIf="form.get('username')?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input matInput type="email" formControlName="email" id="field-email"/>
          <mat-error *ngIf="form.get('email')?.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" *ngIf="!isEdit">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput [type]="showPass ? 'text' : 'password'" formControlName="password" id="field-password"/>
          <button mat-icon-button matSuffix type="button" (click)="showPass = !showPass">
            <mat-icon>{{ showPass ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">Min 6 characters</mat-error>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-stroked-button type="button" routerLink="/dashboard/users">Cancel</button>
        <button mat-raised-button color="primary" type="submit"
                [disabled]="form.invalid || saving" id="btn-save-user">
          <mat-spinner diameter="18" *ngIf="saving"></mat-spinner>
          <span *ngIf="!saving">{{ isEdit ? 'Update' : 'Create' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
